# Demand-generation rules (Assumptions D-01 ... D-10). All values illustrative.

calendar:
  start_date: "2026-06-01"     # a Monday; monsoon season
  history_weeks: 12            # T-02
  holdout_weeks: 4
  seed: 2026

city_scale: 0.5                # multiplies every base volume (keeps data laptop-sized)

# Expected jobs per zone per day, before profiles and day effects.
daily_base:
  office:             {mobility: 350, food: 400}
  restaurant_cluster: {mobility: 300, food: 700}
  residential:        {mobility: 300, food: 450}
  mixed:              {mobility: 300, food: 350}
  transit_hub:        {mobility: 600, food: 80}

# Whole-day multiplier on weekends, by zone type (D-03, D-04, D-05).
weekend_multiplier:
  office: 0.30
  restaurant_cluster: 1.20
  residential: 1.15
  mixed: 1.00
  transit_hub: 0.90

# City-wide hour-of-day shapes (relative weights; normalized in code).
hour_profile:
  weekday:
    mobility: [0.10,0.05,0.03,0.03,0.05,0.20,0.50,1.00,1.80,2.00,1.40,1.00,0.90,0.90,0.90,1.00,1.30,1.90,2.10,1.80,1.30,0.90,0.60,0.30]
    food:     [0.30,0.15,0.05,0.02,0.02,0.05,0.10,0.30,0.50,0.50,0.60,1.20,2.20,2.00,1.00,0.60,0.60,0.80,1.20,2.00,2.40,2.00,1.20,0.60]
  weekend:
    mobility: [0.30,0.20,0.10,0.05,0.05,0.10,0.20,0.40,0.60,0.80,1.00,1.30,1.40,1.30,1.10,1.00,1.10,1.30,1.50,1.60,1.50,1.30,1.00,0.60]
    food:     [0.50,0.30,0.10,0.03,0.02,0.05,0.10,0.30,0.60,0.80,0.90,1.30,1.90,1.90,1.20,0.80,0.80,1.00,1.50,2.50,3.00,2.50,1.60,0.90]

# Zone-type adjustments to the city shape: {day_type: {service: [[start_hour, end_hour], multiplier]}}
# end_hour is exclusive. Hours not listed keep multiplier 1.
zone_type_hour_modifiers:
  office:
    weekday:
      food:     [[[11, 14], 1.8], [[18, 23], 0.4]]       # D-03 lunch rush, empty at night
      mobility: [[[7, 11], 0.6], [[17, 21], 1.6]]        # D-03 evening exodus
  residential:
    weekday:
      food:     [[[11, 14], 0.6], [[19, 23], 1.4]]       # D-04 dinner-heavy
      mobility: [[[7, 11], 1.6], [[17, 21], 0.6]]        # D-04 morning outbound
    weekend:
      food:     [[[19, 23], 1.3]]
  restaurant_cluster:
    weekend:
      food:     [[[21, 24], 1.5], [[0, 2], 1.5]]         # D-05 late nights
  transit_hub:
    weekday:
      mobility: [[[5, 8], 2.0], [[21, 24], 1.5]]         # D-06 early/late spikes
    weekend:
      mobility: [[[5, 8], 2.0], [[21, 24], 1.5]]

rain:                           # D-08
  probability_by_month: {6: 0.35, 7: 0.40, 8: 0.40, 9: 0.45, 10: 0.40, default: 0.10}
  demand_multiplier: {mobility: 1.15, food: 1.30}
  two_wheeler_supply_multiplier: 0.80

events:                         # D-10 stadium nights near CBD
  count: 6
  zones: [CBD]
  only_weekends: false
  effects:
    mobility: [[[21, 24], 2.5]]
    food:     [[[18, 22], 1.3]]

noise:                          # D-09 hidden from all models
  day_lognormal_sigma: 0.10
